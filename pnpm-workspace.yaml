packages:
  - packages/*
  - examples/*

# Repo-local overrides. A global minimumReleaseAge guard chokes on registry
# metadata missing "time" for react-reconciler, so exclude exactly that one
# package (pinned to 0.33.0) instead of disabling the guard repo-wide.
resolutionMode: highest
minimumReleaseAgeExclude:
  - react-reconciler
allowBuilds:
  esbuild: true
