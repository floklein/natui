packages:
  - packages/*
  - examples/*
  - docs

resolutionMode: highest

# These entries are a no-op unless a contributor has a user-level
# `minimumReleaseAge` configured. For those who do, the guard rejects the exact
# pinned versions this repo needs — either the registry metadata has no "time"
# field or the release is newer than the guard window — so they are excluded
# here rather than disabling the guard repo-wide.
minimumReleaseAgeExclude:
  - react-reconciler # pinned 0.33.0
  - react # pinned 19.2.8
  - react-dom # pulled in by the docs site
  - '@radix-ui/primitive' # transitive, via the docs site
allowBuilds:
  esbuild: true
  sharp: true
