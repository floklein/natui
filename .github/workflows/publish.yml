name: Publish

on:
  push:
    tags: ['v*']

# id-token lets npm authenticate this workflow run through OpenID Connect.
# There is no npm token anywhere; npmjs.com must list this workflow file as
# the trusted publisher for all three packages.
permissions:
  contents: read
  id-token: write

jobs:
  npm:
    name: Publish npm packages (trusted publishing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 bundles npm 10.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      # Build before test: @natui/dev resolves @natui/core from packages/natui/dist.
      - run: pnpm build
      - run: pnpm test
      # Confirms the workspace versions match the pushed tag and re-validates
      # all three tarballs before anything reaches the registry.
      - run: pnpm release:check "$GITHUB_REF_NAME"
      - name: Publish @natui/core
        working-directory: packages/natui
        run: npm publish
      # @natui/dev declares its @natui/core peer with the workspace protocol,
      # which only pnpm rewrites to a real version range. Pack with pnpm, then
      # let npm publish the tarball so OIDC trusted publishing still applies.
      - name: Publish @natui/dev
        working-directory: packages/natui-dev
        run: |
          pnpm pack
          npm publish "natui-dev-$(node -p "require('./package.json').version").tgz"
      - name: Publish create-natui-app
        working-directory: packages/create-natui-app
        run: npm publish
