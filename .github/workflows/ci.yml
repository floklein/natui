name: CI

on:
  push:
    branches: [main, claude/poc]
  pull_request:

jobs:
  js:
    name: JS tests, typecheck, package build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Build before typecheck: examples/demo resolves the `@natui/core` package types from
      # packages/natui/dist, which only exists after a build.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm release:check
      - name: Pack npm release
        working-directory: packages/natui
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package-0.2.0
          path: packages/natui/natui-core-0.2.0.tgz
          if-no-files-found: error
      - name: Pack create-natui-app release
        working-directory: packages/create-natui-app
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: create-natui-app-0.2.0
          path: packages/create-natui-app/create-natui-app-0.2.0.tgz
          if-no-files-found: error

  docs:
    name: Documentation checks and build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm docs:build
      - run: pnpm docs:smoke

  macos-host:
    name: Swift host, JS suite, and package (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:host:macos
      - run: pnpm test
      - run: pnpm build
      - run: node --test examples/demo/src/verify-macos-package-static.test.mjs
      - run: pnpm package:demo
      - run: node examples/demo/src/verify-macos-package-static.mjs
      - name: Archive application bundle
        id: mac-package
        shell: bash
        run: |
          package_arch="$(node -p 'process.arch')"
          archive="examples/demo/dist/package/NatUIDemo-0.2.0-macos-${package_arch}.tar.gz"
          tar -czf "$archive" -C examples/demo/dist/package NatUIDemo.app
          echo "architecture=${package_arch}" >> "$GITHUB_OUTPUT"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: NatUIDemo-0.2.0-macos-${{ steps.mac-package.outputs.architecture }}
          path: ${{ steps.mac-package.outputs.archive }}
          if-no-files-found: error
      # The GUI end-to-end suites, including verify:package, need a real
      # window session and run locally per README; CI stays headless.

  windows-host:
    # GUI suites still need a real desktop session. This job compile-checks the
    # development host, then builds and inspects the shippable single-file EXE
    # without starting a window.
    name: WinUI host compile and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter create-natui-app test
      - run: node --test tools/package-app.test.mjs
      - run: dotnet build hosts/windows/NatuiHost -c Release -p:Platform=x64
      - run: pnpm package:demo
      - run: node examples/demo/src/verify-windows-package-static.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: NatUIDemo-0.2.0-windows-x64
          path: examples/demo/dist/package/NatUIDemo-0.2.0-windows-x64.exe
          if-no-files-found: error
