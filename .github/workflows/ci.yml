name: CI

on:
  push:
    branches: [main, claude/poc]
  pull_request:

jobs:
  js:
    name: JS tests, typecheck, package build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Build before typecheck: examples/demo resolves natui's types from
      # packages/natui/dist, which only exists after a build.
      - run: pnpm build
      - run: pnpm typecheck

  macos-host:
    name: Swift host build + JS suite (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:host:macos
      - run: pnpm test
      - run: pnpm build
      # The GUI end-to-end suites (pnpm verify / pnpm verify:embedded) need a
      # real window session and run locally per README; CI stays headless.

  windows-host:
    # Compile check only (first green run: PR #3); now blocking like the
    # other jobs. The app-shell kinds are E2E-verified on macOS; see
    # hosts/windows/NatuiHost/README.md for the Windows divergences.
    name: WinUI host compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build hosts/windows/NatuiHost -c Release -p:Platform=x64
