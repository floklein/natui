name: CI

on:
  push:
    branches: [main, claude/poc]
  pull_request:

jobs:
  js:
    name: JS tests, typecheck, package build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Read the release version once. Hardcoding it in artifact names meant a
      # version bump failed here, in the macOS plist assertion and in the
      # Windows static verifier as three unrelated-looking errors.
      - id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: pnpm lint
      # Build first: @natui/dev resolves `@natui/core` as a real specifier (so an
      # installed app gets its own copy), and examples/demo resolves the package
      # types the same way. Both need packages/natui/dist to exist.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm release:check
      - name: Pack npm release
        working-directory: packages/natui
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ steps.version.outputs.value }}
          path: packages/natui/natui-core-${{ steps.version.outputs.value }}.tgz
          if-no-files-found: error
      - name: Pack @natui/dev release
        working-directory: packages/natui-dev
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package-dev-${{ steps.version.outputs.value }}
          path: packages/natui-dev/natui-dev-${{ steps.version.outputs.value }}.tgz
          if-no-files-found: error
      - name: Pack create-natui-app release
        working-directory: packages/create-natui-app
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: create-natui-app-${{ steps.version.outputs.value }}
          path: packages/create-natui-app/create-natui-app-${{ steps.version.outputs.value }}.tgz
          if-no-files-found: error

  docs:
    name: Documentation checks and build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The docs typecheck compiles the packages it documents, which resolve
      # `@natui/core` through packages/natui/dist.
      - run: pnpm build
      - run: pnpm docs:check
      - run: pnpm docs:build
      - run: pnpm docs:smoke

  macos-host:
    name: Swift host, JS suite, and package (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: pnpm build:host:macos
      # Unit tests for the host's pure logic (seq/ack, Store.apply, colour and
      # menu-spec parsing). NATUI_PACKAGE_APP=1 drops the executable's
      # -sectcreate linker flags, which the test bundle cannot inherit.
      - name: Swift host unit tests
        run: NATUI_PACKAGE_APP=1 swift test --package-path hosts/macos
      # Build before test: @natui/dev resolves @natui/core from packages/natui/dist.
      - run: pnpm build
      - run: pnpm test
      - run: node --test examples/demo/src/verify-macos-package-static.test.mjs
      - run: pnpm package:demo
      - run: node examples/demo/src/verify-macos-package-static.mjs
      - name: Archive application bundle
        id: mac-package
        shell: bash
        run: |
          package_arch="$(node -p 'process.arch')"
          archive="examples/demo/dist/package/NatUIDemo-${{ steps.version.outputs.value }}-macos-${package_arch}.tar.gz"
          tar -czf "$archive" -C examples/demo/dist/package NatUIDemo.app
          echo "architecture=${package_arch}" >> "$GITHUB_OUTPUT"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: NatUIDemo-${{ steps.version.outputs.value }}-macos-${{ steps.mac-package.outputs.architecture }}
          path: ${{ steps.mac-package.outputs.archive }}
          if-no-files-found: error
      # Build and package the universal host binary exactly as the Publish
      # workflow will, so a release tag never hits a broken host asset build.
      - run: swift build -c release --arch arm64 --arch x86_64 --package-path hosts/macos
      - run: node tools/package-host.mjs macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: natui-host-${{ steps.version.outputs.value }}-macos-universal
          path: dist-host/*
          if-no-files-found: error
      # The GUI end-to-end suites, including verify:package, need a real
      # window session and run locally per README; CI stays headless.

  windows-host:
    # GUI suites still need a real desktop session. This job compile-checks the
    # development host, then builds and inspects the shippable single-file EXE
    # without starting a window.
    name: WinUI host compile and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: pnpm install --frozen-lockfile
      - id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Windows carries the most path- and spawn-sensitive code (locate.ts,
      # config path handling, the packager) and was the least gated platform:
      # the core suite and typecheck never ran here.
      # Build before test: @natui/dev resolves @natui/core from packages/natui/dist.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm --filter create-natui-app test
      - run: node --test tools/package-app.test.mjs
      - run: dotnet build hosts/windows/NatuiHost -c Release -p:Platform=x64
      # No .sln, so the test project must be named explicitly.
      - run: dotnet test hosts/windows/NatuiHost.Tests -c Release -p:Platform=x64
      - run: pnpm package:demo
      - run: node examples/demo/src/verify-windows-package-static.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: NatUIDemo-${{ steps.version.outputs.value }}-windows-x64
          path: examples/demo/dist/package/NatUIDemo-${{ steps.version.outputs.value }}-windows-x64.exe
          if-no-files-found: error
      # Package both host release assets exactly as the Publish workflow
      # will, so a release tag never hits a broken host asset build. The
      # arm64 host cross-compiles on the x64 runner; only x64 can be run.
      - run: node tools/package-host.mjs windows-x64
      - run: dotnet build hosts/windows/NatuiHost -c Release -p:Platform=arm64 -p:RuntimeIdentifier=win-arm64
      - run: node tools/package-host.mjs windows-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: natui-host-${{ steps.version.outputs.value }}-windows
          path: dist-host/*
          if-no-files-found: error
